[project]
name = "vardiashift"
version = "1.0.0"
description = "VardiaShift - standalone desktop employee time-in/time-out and attendance management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "qrcode[pil]>=7.4",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    'tzdata; platform_system == "Windows"',
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
webcam = ["opencv-python>=4.8"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyinstaller]
# (packaging is driven by VardiaShift.spec, not by these keys)
